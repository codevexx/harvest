name: Build Windows app

# Builds Harvest.exe on a Windows runner. Pushing a tag like v0.1.0 also
# publishes the exe to a GitHub Release, which is what the website's
# "Download" button points at (releases/latest/download/Harvest.exe).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller

      - name: Build icon
        run: python desktop/make_icon.py

      - name: Build Harvest.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Harvest
          --icon desktop/harvest.ico
          --paths .
          --collect-submodules pystray
          desktop/harvest_tray.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harvest-windows
          path: dist/Harvest.exe

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Harvest.exe
          fail_on_unmatched_files: true
